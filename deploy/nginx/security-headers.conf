# Included in every location that sets its own headers (nginx's add_header
# in a location replaces, not extends, the server-level ones).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
# HSTS is set at the edge (Cloudflare SSL/TLS > Edge Certificates), not here,
# so the same image can also run behind plain HTTP during local checks.
