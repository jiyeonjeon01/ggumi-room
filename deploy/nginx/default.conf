# Ggumiroom web: static React + Phaser build.
# Reached only through the Docker network (cloudflared -> web:8080) and,
# for local checks, 127.0.0.1:8080 on the host.

# Access log without query strings (future tokens/ids must not land in logs)
# and with the visitor IP Cloudflare forwards instead of the tunnel's.
# The original request path without "?query" ($uri would show /index.html
# for SPA fallbacks).
map $request_uri $request_path {
    ~^(?<path>[^?]*) $path;
}
log_format ggumi '$http_cf_connecting_ip [$time_local] "$request_method $request_path $server_protocol" '
                 '$status $body_bytes_sent "$http_user_agent" $request_time';

# Visitor IP: Cloudflare's header in production, the socket address locally.
map $http_cf_connecting_ip $client_ip {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    access_log /dev/stdout ggumi;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain font/ttf;

    include /etc/nginx/snippets/security-headers.conf;

    # Container health check (not logged).
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Hashed build output: safe to cache for a year.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Font file name has no hash; cache for 30 days.
    # nginx's mime.types has no ttf entry, so declare it here.
    location /fonts/ {
        types { font/ttf ttf; }
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # FastAPI. The path is passed through unchanged (/api/... -> api:8000/api/...).
    # The upstream is resolved at request time through Docker's DNS, so nginx
    # (and the game) still starts when the api container is down.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_ip;
        proxy_set_header X-Forwarded-For $client_ip;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        client_max_body_size 64k;
        proxy_intercept_errors on;
        error_page 502 503 504 = @api_unavailable;
    }

    location @api_unavailable {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 503 '{"detail":"서버가 잠시 쉬고 있어요. 조금 뒤에 다시 시도해 주세요."}';
    }

    # Reserved for FastAPI WebSocket.
    location /ws/ {
        return 404;
        # proxy_pass http://api;
        # proxy_http_version 1.1;
        # proxy_set_header Upgrade $http_upgrade;
        # proxy_set_header Connection $connection_upgrade;
        # proxy_set_header Host $host;
        # proxy_read_timeout 3600s;
    }

    # SPA: unknown paths serve index.html; never cache the HTML itself so a
    # new deploy is picked up immediately.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
