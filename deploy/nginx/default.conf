# Ggumiroom web: static React + Phaser build.
# Reached only through the Docker network (cloudflared -> web:8080) and,
# for local checks, 127.0.0.1:8080 on the host.

# Access log without query strings (future tokens/ids must not land in logs)
# and with the visitor IP Cloudflare forwards instead of the tunnel's.
# The original request path without "?query" ($uri would show /index.html
# for SPA fallbacks).
map $request_uri $request_path {
    ~^(?<path>[^?]*) $path;
}
log_format ggumi '$http_cf_connecting_ip [$time_local] "$request_method $request_path $server_protocol" '
                 '$status $body_bytes_sent "$http_user_agent" $request_time';

# Future backend. Uncomment together with the `api` service in docker-compose.yml.
# Kept commented now: nginx refuses to start if an upstream host doesn't resolve.
# upstream api { server api:8000; }

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    access_log /dev/stdout ggumi;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    include /etc/nginx/snippets/security-headers.conf;

    # Container health check (not logged).
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Hashed build output: safe to cache for a year.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Font file name has no hash; cache for 30 days.
    location /fonts/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # Reserved for FastAPI. Answers 404 now instead of falling back to the
    # SPA (which would return HTML to API clients).
    location /api/ {
        default_type application/json;
        return 404 '{"detail":"Not Found"}';
        # proxy_pass http://api;
        # proxy_set_header Host $host;
        # proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        # proxy_set_header X-Forwarded-Proto https;
    }

    # Reserved for FastAPI WebSocket.
    location /ws/ {
        return 404;
        # proxy_pass http://api;
        # proxy_http_version 1.1;
        # proxy_set_header Upgrade $http_upgrade;
        # proxy_set_header Connection $connection_upgrade;
        # proxy_set_header Host $host;
        # proxy_read_timeout 3600s;
    }

    # SPA: unknown paths serve index.html; never cache the HTML itself so a
    # new deploy is picked up immediately.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
